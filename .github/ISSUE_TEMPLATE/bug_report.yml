name: Bug report
description: Report a reproducible problem in WebMux
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WebMux version
      placeholder: v1.3.2
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, transport, and other relevant configuration.
