name: Packaging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Keep the independent Argon2 compatibility fixture compatible with macOS runners.
env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  native-preview:
    timeout-minutes: 30
    name: Native bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-arm64
            runner: macos-26
          - os: ubuntu-22.04
            runner: ubuntu-22.04
          - os: windows-2022
            runner: windows-2022
          - os: windows-11-arm
            runner: windows-11-arm
    runs-on: ${{ matrix.os == 'macos-arm64' && github.event_name != 'pull_request' && vars.WEBMUX_MACOS_RUNNER || matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_AUTOREMOVE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    steps:
      - name: Verify temporary macOS runner and record provenance
        id: macos_runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          printf 'macOS ARM64 runner: %s\n' "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"
          sw_vers >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            cache_root="$RUNNER_TOOL_CACHE/webmux-build-cache"
            mkdir -p "$cache_root"
            printf 'NPM_CONFIG_CACHE=%s/npm\n' "$cache_root" >> "$GITHUB_ENV"
            printf 'GOCACHE=%s/go-build\n' "$cache_root" >> "$GITHUB_ENV"
            printf 'GOPATH=%s/go\n' "$cache_root" >> "$GITHUB_ENV"
            if brew list --formula --full-name | grep -Eq '(^|/)webmux$'; then
              echo 'Refusing to change an existing WebMux Homebrew installation.' >&2
              exit 1
            fi
            if brew tap | grep -Eq '^(webmux/(native-test|packaging-test)|jordanhubbard/webmux)$'; then
              echo 'Refusing to change existing qualification taps.' >&2
              exit 1
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: webmux/server/go.mod
          cache: ${{ runner.environment != 'self-hosted' }}
          cache-dependency-path: webmux/server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: webmux/package-lock.json
      - name: Verify native release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/packaging-checks.mts release-version
      - name: Package combined native bundle
        if: runner.os != 'Windows'
        run: make package
      - name: Package separate native client and server archives
        if: runner.os != 'Windows'
        run: |
          make package-client
          make package-server
      - name: Verify native source build and manual controls
        if: runner.os != 'Windows'
        run: |
          make -o deps build
          node scripts/smoke-source.mts
      - name: Verify native Unix service lifecycle
        if: runner.os != 'Windows'
        run: node scripts/smoke-unix-service.mts
      - name: Verify native Make service installation
        if: runner.os == 'macOS'
        run: node scripts/smoke-unix-service.mts --make
      - name: Verify native Make user-service installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo -n systemctl start "user@$(id -u).service"
          systemctl --user show-environment > /dev/null
          node scripts/smoke-unix-service.mts --make
      - name: Install WiX for native MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native Windows archive and MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
      - name: Exercise extracted native runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/webmux-native"
          for archive in dist/*-native.tar.gz dist/*-native.zip; do
            if [ -f "$archive" ]; then tar -xf "$archive" -C "$RUNNER_TEMP/webmux-native"; fi
          done
          node scripts/smoke-native-package.mts "$RUNNER_TEMP"/webmux-native/webmux-[0-9]*
      - name: Exercise extracted Windows native runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem dist -Filter '*-native.zip' | Where-Object { $_.Name -notmatch '^webmux-(client|server)-' })
          if ($archives.Count -ne 1) { throw 'Expected exactly one native archive.' }
          $extract = Join-Path $env:RUNNER_TEMP 'webmux-native'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extract
          $roots = @(Get-ChildItem $extract -Directory)
          if ($roots.Count -ne 1) { throw 'Expected exactly one extracted installation.' }
          ./scripts/windows-service-runtime.test.ps1 -RuntimeModule (Join-Path $roots[0].FullName 'service/runtime.psm1')
          node scripts/smoke-native-package.mts $roots[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime smoke failed.' }
      - name: Exercise installed native MSI and service
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -Filter '*-native.msi')
          if ($installers.Count -ne 1) { throw 'Expected exactly one native MSI.' }
          # Keep the last Node release as an external upgrade fixture.
          $arch = node -p process.arch
          $previous = Join-Path $env:RUNNER_TEMP 'webmux-previous'
          New-Item -ItemType Directory -Path $previous -Force | Out-Null
          gh release download v1.3.11 --repo jordanhubbard/webmux --pattern "webmux-1.3.11-windows-$arch.msi*" --dir $previous
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the upgrade fixture.' }
          $previousMSI = Join-Path $previous "webmux-1.3.11-windows-$arch.msi"
          $expected = ((Get-Content -LiteralPath "$previousMSI.sha256").Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $previousMSI -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Upgrade fixture checksum mismatch.' }
          ./scripts/smoke-native-msi.ps1 -Installer $installers[0].FullName
          ./scripts/smoke-native-msi.ps1 -Installer $installers[0].FullName -PreviousInstaller $previousMSI
      - name: Set up Homebrew for native installation
        if: runner.os != 'Windows' && runner.environment != 'self-hosted'
        uses: Homebrew/actions/setup-homebrew@3b81d438eda92ee13b5849940d993be027717ecf
      # Homebrew prepends its bin directory; restore the pinned, self-contained
      # Node runtime before brew upgrades can break the runner's brewed Node.
      - name: Restore Node 24 after Homebrew PATH setup
        if: runner.os != 'Windows'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}
      - name: Unlink runner OpenSSL 1.1 before dependency upgrades
        if: runner.os == 'macOS' && runner.environment != 'self-hosted'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          # The runner links via opt/, which brew unlink does not remove.
          openssl_link="$(brew --prefix)/bin/openssl"
          if [ -L "$openssl_link" ]; then
            case "$(readlink "$openssl_link")" in
              */openssl@1.1/*) rm -f "$openssl_link" ;;
            esac
          fi
      - name: Install and test native Homebrew HEAD default
        if: runner.os != 'Windows'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew trust --formula asheshgoplani/tap/agent-deck
          brew tap asheshgoplani/tap
          brew tap-new --no-git webmux/native-test
          git clone --bare . "$RUNNER_TEMP/webmux-head.git"
          git --git-dir="$RUNNER_TEMP/webmux-head.git" update-ref refs/heads/main HEAD
          git --git-dir="$RUNNER_TEMP/webmux-head.git" symbolic-ref HEAD refs/heads/main
          cp -f Formula/webmux.rb "$(brew --repository webmux/native-test)/Formula/webmux.rb"
          WEBMUX_TEST_FORMULA="$(brew --repository webmux/native-test)/Formula/webmux.rb"
          export WEBMUX_TEST_FORMULA
          node scripts/packaging-checks.mts formula-head
          brew install --HEAD --build-from-source --skip-link webmux/native-test/webmux
          brew test --force webmux/native-test/webmux
          node scripts/smoke-native-package.mts "$(brew --prefix webmux/native-test/webmux)/libexec"
          brew services info webmux/native-test/webmux --json > "$RUNNER_TEMP/webmux-service.json"
          node scripts/packaging-checks.mts service
      - name: Verify native upload set and checksums
        run: node scripts/verify-native-artifacts.mts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-preview-${{ matrix.os }}
          path: dist/*-native.*

      - name: Remove temporary Homebrew qualification installations
        if: always() && steps.macos_runner.outcome == 'success' && runner.environment == 'self-hosted' && runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          for tap in webmux/native-test webmux/packaging-test; do
            if brew list --formula --full-name | grep -Fxq "$tap/webmux"; then
              brew uninstall --formula "$tap/webmux"
            fi
            if brew tap | grep -Fxq "$tap"; then brew untap "$tap"; fi
          done

  package:
    timeout-minutes: 30
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-arm64
            runner: macos-26
          - os: ubuntu-22.04
            runner: ubuntu-22.04
    runs-on: ${{ matrix.os == 'macos-arm64' && github.event_name != 'pull_request' && vars.WEBMUX_MACOS_RUNNER || matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_AUTOREMOVE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    steps:
      - name: Verify temporary macOS runner and record provenance
        id: macos_runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          printf 'macOS ARM64 runner: %s\n' "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"
          sw_vers >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            cache_root="$RUNNER_TOOL_CACHE/webmux-build-cache"
            mkdir -p "$cache_root"
            printf 'NPM_CONFIG_CACHE=%s/npm\n' "$cache_root" >> "$GITHUB_ENV"
            printf 'GOCACHE=%s/go-build\n' "$cache_root" >> "$GITHUB_ENV"
            printf 'GOPATH=%s/go\n' "$cache_root" >> "$GITHUB_ENV"
            if brew list --formula --full-name | grep -Eq '(^|/)webmux$'; then
              echo 'Refusing to change an existing WebMux Homebrew installation.' >&2
              exit 1
            fi
            if brew tap | grep -Eq '^(webmux/(native-test|packaging-test)|jordanhubbard/webmux)$'; then
              echo 'Refusing to change existing qualification taps.' >&2
              exit 1
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: webmux/server/go.mod
          cache: ${{ runner.environment != 'self-hosted' }}
          cache-dependency-path: webmux/server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: webmux/package-lock.json
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node scripts/packaging-checks.mts release-version
      - name: Build runtime bundle
        run: make package
      - name: Test extracted bundle
        run: |
          mkdir "$RUNNER_TEMP/webmux-bundle"
          tar -xzf dist/webmux-*.tar.gz -C "$RUNNER_TEMP/webmux-bundle"
          node scripts/smoke-native-package.mts "$RUNNER_TEMP"/webmux-bundle/webmux-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webmux-${{ matrix.os }}
          path: dist/*
      - name: Set up Homebrew
        if: runner.environment != 'self-hosted'
        uses: Homebrew/actions/setup-homebrew@3b81d438eda92ee13b5849940d993be027717ecf
      # Homebrew prepends its bin directory; restore the pinned, self-contained
      # Node runtime before brew upgrades can break the runner's brewed Node.
      - name: Restore Node 24 after Homebrew PATH setup
        if: runner.os != 'Windows'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}
      - name: Verify documented tap bootstrap
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          XDG_CONFIG_HOME: ${{ runner.temp }}/homebrew-bootstrap-config
        run: |
          brew trust --formula asheshgoplani/tap/agent-deck
          brew tap asheshgoplani/tap
          brew trust --formula jordanhubbard/webmux/webmux
          brew tap jordanhubbard/webmux "$GITHUB_WORKSPACE"
          brew info jordanhubbard/webmux/webmux --json=v2 > "$RUNNER_TEMP/webmux-tap-info.json"
          node scripts/packaging-checks.mts tap
          brew untap jordanhubbard/webmux
      - name: Unlink runner OpenSSL 1.1 before dependency upgrades
        if: runner.os == 'macOS' && runner.environment != 'self-hosted'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          # The runner links via opt/, which brew unlink does not remove.
          openssl_link="$(brew --prefix)/bin/openssl"
          if [ -L "$openssl_link" ]; then
            case "$(readlink "$openssl_link")" in
              */openssl@1.1/*) rm -f "$openssl_link" ;;
            esac
          fi
      - name: Install formula from this revision
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew trust --formula asheshgoplani/tap/agent-deck
          brew tap asheshgoplani/tap
          brew tap-new --no-git webmux/packaging-test
          git archive --format=tar.gz --output="$RUNNER_TEMP/webmux-source.tar.gz" HEAD
          cp -f Formula/webmux.rb "$(brew --repository webmux/packaging-test)/Formula/webmux.rb"
          WEBMUX_TEST_FORMULA="$(brew --repository webmux/packaging-test)/Formula/webmux.rb"
          export WEBMUX_TEST_FORMULA
          node scripts/packaging-checks.mts formula
          brew install --build-from-source --skip-link webmux/packaging-test/webmux
          brew test --force webmux/packaging-test/webmux
      - name: Verify service definition
        run: |
          brew services info webmux/packaging-test/webmux --json > "$RUNNER_TEMP/webmux-service.json"
          node scripts/packaging-checks.mts service

      - name: Remove temporary Homebrew qualification installations
        if: always() && steps.macos_runner.outcome == 'success' && runner.environment == 'self-hosted' && runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          for tap in webmux/native-test webmux/packaging-test; do
            if brew list --formula --full-name | grep -Fxq "$tap/webmux"; then
              brew uninstall --formula "$tap/webmux"
            fi
            if brew tap | grep -Fxq "$tap"; then brew untap "$tap"; fi
          done
          if brew tap | grep -Fxq jordanhubbard/webmux; then brew untap jordanhubbard/webmux; fi

  verify-native-release:
    name: Verify native release artifacts
    needs: [native-preview]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-preview-*
          path: dist
      - name: Verify complete native release set
        run: node scripts/verify-native-artifacts.mts --release dist

  publish:
    name: Attach release bundles
    if: github.event_name == 'release'
    needs: [verify-native-release, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-preview-*
          path: dist
      - name: Verify complete native release set
        run: node scripts/verify-native-artifacts.mts --release dist
      - name: Upload verified bundles and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*/* --clobber
