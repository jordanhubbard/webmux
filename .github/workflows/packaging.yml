name: Packaging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Keep native macOS addons compatible with the prior runner deployment target.
env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  native-preview:
    name: Native bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: webmux/server/go.mod
          cache-dependency-path: webmux/server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webmux/package-lock.json
      - name: Build existing frontend
        if: runner.os != 'Windows'
        working-directory: webmux
        run: |
          npm ci
          npm run build --workspace=frontend
      - name: Package native server
        if: runner.os != 'Windows'
        run: node scripts/package-native.mts
      - name: Verify native source build and manual controls
        if: runner.os != 'Windows'
        run: |
          make -o deps build WEBMUX_BACKEND=go
          node scripts/smoke-source.mts go
      - name: Verify native Unix service lifecycle
        if: runner.os != 'Windows'
        run: node scripts/smoke-unix-service.mts
      - name: Install WiX for native MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native Windows archive and MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -Backend node
          ./scripts/package-windows.ps1 -Backend go
      - name: Exercise extracted native runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/webmux-native"
          for archive in dist/*-native.tar.gz dist/*-native.zip; do
            if [ -f "$archive" ]; then tar -xf "$archive" -C "$RUNNER_TEMP/webmux-native"; fi
          done
          node scripts/smoke-native-package.mts "$RUNNER_TEMP"/webmux-native/webmux-*
      - name: Exercise extracted Windows native runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem dist -Filter '*-native.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one native archive.' }
          $extract = Join-Path $env:RUNNER_TEMP 'webmux-native'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extract
          $roots = @(Get-ChildItem $extract -Directory)
          if ($roots.Count -ne 1) { throw 'Expected exactly one extracted installation.' }
          ./scripts/windows-service-runtime.test.ps1 -RuntimeModule (Join-Path $roots[0].FullName 'service/runtime.psm1')
          node scripts/smoke-native-package.mts $roots[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime smoke failed.' }
      - name: Exercise installed native MSI and service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -Filter '*-native.msi')
          if ($installers.Count -ne 1) { throw 'Expected exactly one native MSI.' }
          $previous = @(Get-ChildItem dist -Filter '*.msi' | Where-Object { $_.Name -notlike '*-native.msi' })
          if ($previous.Count -ne 1) { throw 'Expected exactly one legacy MSI.' }
          ./scripts/smoke-native-msi.ps1 -Installer $installers[0].FullName
          ./scripts/smoke-native-msi.ps1 -Installer $installers[0].FullName -PreviousInstaller $previous[0].FullName
      - name: Set up Homebrew for native installation
        if: runner.os != 'Windows'
        uses: Homebrew/actions/setup-homebrew@3b81d438eda92ee13b5849940d993be027717ecf
      - name: Install and test native Homebrew formula
        if: runner.os != 'Windows'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew tap-new --no-git webmux/native-test
          git archive --format=tar.gz --output="$RUNNER_TEMP/webmux-source.tar.gz" HEAD
          cp -f Formula/webmux.rb "$(brew --repository webmux/native-test)/Formula/webmux.rb"
          export WEBMUX_TEST_FORMULA="$(brew --repository webmux/native-test)/Formula/webmux.rb"
          node scripts/packaging-checks.mts formula
          brew install --build-from-source --with-native-server webmux/native-test/webmux
          brew test webmux/native-test/webmux
          node scripts/smoke-native-package.mts "$(brew --prefix webmux/native-test/webmux)/libexec"
          brew services info webmux/native-test/webmux --json > "$RUNNER_TEMP/webmux-service.json"
          node scripts/packaging-checks.mts service
      - uses: actions/upload-artifact@v7
        with:
          name: native-preview-${{ matrix.os }}
          path: dist/*-native.*

  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webmux/package-lock.json
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node scripts/packaging-checks.mts release-version
      - name: Build runtime bundle
        run: make package
      - name: Test extracted bundle
        run: |
          mkdir "$RUNNER_TEMP/webmux-bundle"
          tar -xzf dist/webmux-*.tar.gz -C "$RUNNER_TEMP/webmux-bundle"
          node scripts/smoke-package.mts "$RUNNER_TEMP"/webmux-bundle/webmux-*
      - uses: actions/upload-artifact@v7
        with:
          name: webmux-${{ matrix.os }}
          path: dist/*
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3b81d438eda92ee13b5849940d993be027717ecf
      - name: Verify documented tap bootstrap
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          XDG_CONFIG_HOME: ${{ runner.temp }}/homebrew-bootstrap-config
        run: |
          brew trust --formula jordanhubbard/webmux/webmux
          brew tap jordanhubbard/webmux "$GITHUB_WORKSPACE"
          brew info jordanhubbard/webmux/webmux --json=v2 > "$RUNNER_TEMP/webmux-tap-info.json"
          node scripts/packaging-checks.mts tap
          brew untap jordanhubbard/webmux
      - name: Install formula from this revision
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew tap-new --no-git webmux/packaging-test
          git archive --format=tar.gz --output="$RUNNER_TEMP/webmux-source.tar.gz" HEAD
          cp -f Formula/webmux.rb "$(brew --repository webmux/packaging-test)/Formula/webmux.rb"
          export WEBMUX_TEST_FORMULA="$(brew --repository webmux/packaging-test)/Formula/webmux.rb"
          node scripts/packaging-checks.mts formula
          brew install --build-from-source webmux/packaging-test/webmux
          brew test webmux/packaging-test/webmux
      - name: Verify service definition
        run: |
          brew services info webmux/packaging-test/webmux --json > "$RUNNER_TEMP/webmux-service.json"
          node scripts/packaging-checks.mts service

  windows-package:
    name: Package (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webmux/package-lock.json
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node scripts/packaging-checks.mts release-version
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows bundle and MSI
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Test extracted Windows bundle
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist -Filter 'webmux-*-windows-${{ matrix.arch }}-node24.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Windows runtime bundle was not created.' }
          $extract = Join-Path $env:RUNNER_TEMP 'webmux-windows-bundle'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          $root = Get-ChildItem $extract -Directory | Select-Object -First 1
          node scripts/smoke-package.mts $root.FullName
      - name: Install, test, and uninstall MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist -Filter 'webmux-*-windows-${{ matrix.arch }}.msi' | Select-Object -First 1
          if (-not $msi) { throw 'Windows MSI was not created.' }
          $installLog = Join-Path $env:RUNNER_TEMP 'webmux-msi-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'webmux-msi-uninstall.log'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\WebMux'
          try {
            $process = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart', '/l*v', $installLog) -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath $installLog
              throw "MSI installation failed with exit code $($process.ExitCode)."
            }
            if (-not (Test-Path -LiteralPath (Join-Path $installRoot 'bin\webmux.cmd'))) {
              throw 'MSI did not install the WebMux launcher.'
            }
            node scripts/smoke-package.mts $installRoot
          } finally {
            if (Test-Path -LiteralPath $installRoot) {
              $process = Start-Process msiexec.exe -ArgumentList @('/x', $msi.FullName, '/qn', '/norestart', '/l*v', $uninstallLog) -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                Get-Content -LiteralPath $uninstallLog
                throw "MSI uninstall failed with exit code $($process.ExitCode)."
              }
            }
          }
          if (Test-Path -LiteralPath (Join-Path $installRoot 'bin\webmux.cmd')) {
            throw 'MSI uninstall left the WebMux launcher behind.'
          }
      - uses: actions/upload-artifact@v7
        with:
          name: webmux-${{ matrix.runner }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.msi
            dist/*.msi.sha256

  publish:
    name: Attach release bundles
    if: github.event_name == 'release'
    needs: [package, windows-package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: webmux-*
          path: dist
          merge-multiple: true
      - name: Upload verified bundles and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
