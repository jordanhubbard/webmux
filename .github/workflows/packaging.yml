name: Packaging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webmux/package-lock.json
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./webmux/backend/package.json").version) process.exit(1)'
      - name: Build runtime bundle
        run: make package
      - name: Test extracted bundle
        run: |
          mkdir "$RUNNER_TEMP/webmux-bundle"
          tar -xzf dist/webmux-*.tar.gz -C "$RUNNER_TEMP/webmux-bundle"
          node scripts/smoke-package.cjs "$RUNNER_TEMP"/webmux-bundle/webmux-*
      - uses: actions/upload-artifact@v7
        with:
          name: webmux-${{ matrix.os }}
          path: dist/*
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3b81d438eda92ee13b5849940d993be027717ecf
      - name: Verify documented tap bootstrap
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          XDG_CONFIG_HOME: ${{ runner.temp }}/homebrew-bootstrap-config
        run: |
          brew trust --formula jordanhubbard/webmux/webmux
          brew tap jordanhubbard/webmux "$GITHUB_WORKSPACE"
          brew info jordanhubbard/webmux/webmux --json=v2 > "$RUNNER_TEMP/webmux-tap-info.json"
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const formula = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/webmux-tap-info.json`)).formulae[0];
          assert.equal(formula.full_name, 'jordanhubbard/webmux/webmux');
          JS
          brew untap jordanhubbard/webmux
      - name: Install formula from this revision
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew tap-new --no-git webmux/packaging-test
          git archive --format=tar.gz --output="$RUNNER_TEMP/webmux-source.tar.gz" HEAD
          cp -f Formula/webmux.rb "$(brew --repository webmux/packaging-test)/Formula/webmux.rb"
          export WEBMUX_TEST_FORMULA="$(brew --repository webmux/packaging-test)/Formula/webmux.rb"
          node - <<'JS'
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const source = `${process.env.RUNNER_TEMP}/webmux-source.tar.gz`;
          const file = process.env.WEBMUX_TEST_FORMULA;
          const sha = createHash('sha256').update(fs.readFileSync(source)).digest('hex');
          fs.writeFileSync(file, fs.readFileSync(file, 'utf8')
            .replace(/^  url .*$/m, `  url "file://${source}"\n  version "0.0.0"`)
            .replace(/^  sha256 .*$/m, `  sha256 "${sha}"`));
          JS
          brew install --build-from-source webmux/packaging-test/webmux
          brew test webmux/packaging-test/webmux
      - name: Verify service definition
        run: |
          brew services info webmux/packaging-test/webmux --json > "$RUNNER_TEMP/webmux-service.json"
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [service] = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/webmux-service.json`));
          assert(service.command.endsWith('/opt/webmux/bin/webmux'));
          assert(service.working_dir);
          assert(service.log_path.endsWith('/var/log/webmux.log'));
          JS

  windows-package:
    name: Package (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webmux/package-lock.json
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./webmux/backend/package.json").version) process.exit(1)'
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows bundle and MSI
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Test extracted Windows bundle
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist -Filter 'webmux-*-windows-${{ matrix.arch }}-node24.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Windows runtime bundle was not created.' }
          $extract = Join-Path $env:RUNNER_TEMP 'webmux-windows-bundle'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          $root = Get-ChildItem $extract -Directory | Select-Object -First 1
          node scripts/smoke-package.cjs $root.FullName
      - name: Install, test, and uninstall MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist -Filter 'webmux-*-windows-${{ matrix.arch }}.msi' | Select-Object -First 1
          if (-not $msi) { throw 'Windows MSI was not created.' }
          $installLog = Join-Path $env:RUNNER_TEMP 'webmux-msi-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'webmux-msi-uninstall.log'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\WebMux'
          try {
            $process = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart', '/l*v', $installLog) -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath $installLog
              throw "MSI installation failed with exit code $($process.ExitCode)."
            }
            if (-not (Test-Path -LiteralPath (Join-Path $installRoot 'bin\webmux.cmd'))) {
              throw 'MSI did not install the WebMux launcher.'
            }
            node scripts/smoke-package.cjs $installRoot
          } finally {
            if (Test-Path -LiteralPath $installRoot) {
              $process = Start-Process msiexec.exe -ArgumentList @('/x', $msi.FullName, '/qn', '/norestart', '/l*v', $uninstallLog) -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                Get-Content -LiteralPath $uninstallLog
                throw "MSI uninstall failed with exit code $($process.ExitCode)."
              }
            }
          }
          if (Test-Path -LiteralPath (Join-Path $installRoot 'bin\webmux.cmd')) {
            throw 'MSI uninstall left the WebMux launcher behind.'
          }
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: webmux-${{ matrix.runner }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.msi
            dist/*.msi.sha256

  publish:
    name: Attach release bundles
    if: github.event_name == 'release'
    needs: [package, windows-package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: webmux-*
          path: dist
          merge-multiple: true
      - name: Upload verified bundles and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
