name: macOS client install diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Original helpers with ${{ matrix.cache }} Go cache
    runs-on: macos-arm64
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    strategy:
      fail-fast: false
      matrix:
        cache: [cold, warm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: webmux/server/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webmux/package-lock.json
      - name: Admit disposable native worker and record headroom
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = arm64
          sw_vers
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          memory_pressure -Q
          python3 - <<'PY'
          import os, shutil, subprocess, re
          for p in [os.environ['GITHUB_WORKSPACE'], os.environ['RUNNER_TEMP']]:
              s = shutil.disk_usage(p)
              assert s.free >= 10 * 1024**3 and s.free / s.total >= .10, 'Insufficient diagnostic disk headroom'
          pressure = subprocess.check_output(['memory_pressure', '-Q'], text=True)
          free = int(re.search(r'System-wide memory free percentage: (\d+)%', pressure).group(1))
          assert free >= 10, 'Insufficient diagnostic memory headroom'
          PY
      - name: Install unchanged helper dependencies
        working-directory: webmux
        run: npm ci
      - name: Observe the original full helper suite
        run: python3 scripts/diagnose-client-install.py --cache-mode '${{ matrix.cache }}' --output "$RUNNER_TEMP/client-install-${{ matrix.cache }}"
      - name: Preserve original diagnostic outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-client-install-${{ matrix.cache }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/client-install-${{ matrix.cache }}/summary.json
            ${{ runner.temp }}/client-install-${{ matrix.cache }}/*.log
            ${{ runner.temp }}/client-install-${{ matrix.cache }}/*.jsonl
