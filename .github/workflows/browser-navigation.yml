name: Browser startup diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'webmux/server/internal/browser/**'
      - 'webmux/server/go.mod'
      - 'webmux/server/go.sum'
      - 'webmux/package*.json'
      - '.github/workflows/browser-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'webmux/server/internal/browser/**'
      - 'webmux/server/go.mod'
      - 'webmux/server/go.sum'
      - 'webmux/package*.json'
      - '.github/workflows/browser-navigation.yml'
  workflow_dispatch:
    inputs:
      cleanup_samples:
        description: 'Additional independent private-profile cleanup samples'
        type: choice
        required: false
        default: '0'
        options: ['0', '20', '100']
      cleanup_processes:
        description: 'Observe owned Chrome process handles after each trial'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  first-navigation:
    name: Windows first-navigation diagnostics
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: webmux/server/go.mod
          cache-dependency-path: webmux/server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webmux/package-lock.json
      - name: Check diagnostic worker resources
        shell: pwsh
        run: |
          Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'" | Select-Object DeviceID, Size, FreeSpace
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory
      - run: npm ci
        working-directory: webmux
      - run: npx playwright install chromium
        id: browser_tools
        working-directory: webmux
      - name: Prepare protected Windows Chromium access
        shell: pwsh
        working-directory: webmux
        run: |
          $browser = (node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the qualified Chromium executable.' }
          $cache = Join-Path $env:LOCALAPPDATA 'ms-playwright'
          if ($env:PLAYWRIGHT_BROWSERS_PATH) {
            if (-not [IO.Path]::IsPathRooted($env:PLAYWRIGHT_BROWSERS_PATH)) { throw 'Expected an absolute owned Playwright cache.' }
            $cache = $env:PLAYWRIGHT_BROWSERS_PATH
          }
          & ../scripts/test-windows-chromium-sandbox.ps1 -TestRoot (Join-Path $env:RUNNER_TEMP 'chromium-sandbox-scope-controls') -ReceiptPath (Join-Path $env:RUNNER_TEMP 'chromium-sandbox-scope.json')
          & ../scripts/prepare-windows-chromium-sandbox.ps1 -BrowserPath $browser -InstallRoot $cache -ReceiptPath (Join-Path $env:RUNNER_TEMP 'chromium-sandbox-access.json')
      - name: Qualify fresh first-navigation controls
        working-directory: webmux
        shell: pwsh
        env:
          WEBMUX_REAL_BROWSER: '1'
          WEBMUX_BROWSER_REQUIRE_NETWORK_APPCONTAINER: '1'
          WEBMUX_BROWSER_NAVIGATION_DIAGNOSTICS: '1'
        run: |
          $env:WEBMUX_BROWSER_EXECUTABLE = (node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the qualified Chromium executable.' }
          $env:WEBMUX_BROWSER_NAVIGATION_ARTIFACT_DIR = Join-Path $env:RUNNER_TEMP 'native-first-navigation'
          Push-Location server
          try {
            go test ./internal/browser -run '^(TestNativeFirstNavigationComponents|TestNativeNavigationTraceCancellation|TestFirstNavigation(NetLog|Trace|Output|Cleanup).*)$' -count=1 -timeout=3m -v
            if ($LASTEXITCODE -ne 0) { throw 'Native first-navigation diagnostics failed.' }
          } finally { Pop-Location }
      - name: Sample independent navigation traces
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        working-directory: webmux
        shell: pwsh
        env:
          WEBMUX_REAL_BROWSER: '1'
          WEBMUX_BROWSER_REQUIRE_NETWORK_APPCONTAINER: '1'
          WEBMUX_BROWSER_NAVIGATION_DIAGNOSTICS: '1'
        run: |
          $env:WEBMUX_BROWSER_EXECUTABLE = (node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the qualified Chromium executable.' }
          $failed = $false
          Push-Location server
          try {
            foreach ($trial in 1..3) {
              $env:WEBMUX_BROWSER_NAVIGATION_ARTIFACT_DIR = Join-Path $env:RUNNER_TEMP "native-first-navigation/trace-sample-$trial"
              go test ./internal/browser -run '^(TestNativeFirstNavigationComponents|TestNativeNavigationTraceCancellation)$/direct(-home)?-trace(-loading(-log)?)?(-late)?$' -count=1 -timeout=3m -v
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
          } finally { Pop-Location }
          if ($failed) { throw 'One or more independent navigation trace samples failed.' }
      - name: Verify owned-file handle snapshot controls
        id: cleanup_handle_controls
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        working-directory: webmux/server
        shell: pwsh
        run: |
          go test ./internal/browser -run '^TestFirstNavigationHandleSnapshotOwnedFileAndIdentityRefusal$' -count=1 -timeout=1m -v
          if ($LASTEXITCODE -ne 0) { throw 'Owned-file snapshot controls failed; do not run the sampling cohort.' }
      - name: Observe independent private-profile cleanup samples
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_samples != '0' && !cancelled() && steps.browser_tools.outcome == 'success' && steps.cleanup_handle_controls.outcome == 'success' }}
        working-directory: webmux
        shell: pwsh
        env:
          WEBMUX_REAL_BROWSER: '1'
          WEBMUX_BROWSER_REQUIRE_NETWORK_APPCONTAINER: '1'
          WEBMUX_BROWSER_NAVIGATION_DIAGNOSTICS: '1'
          WEBMUX_BROWSER_CLEANUP_PROCESSES: ${{ inputs.cleanup_processes && '1' || '0' }}
          WEBMUX_PROFILE_CLEANUP_SAMPLES: ${{ inputs.cleanup_samples }}
        run: |
          $env:WEBMUX_BROWSER_EXECUTABLE = (node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the qualified Chromium executable.' }
          $samples = [int]$env:WEBMUX_PROFILE_CLEANUP_SAMPLES
          if ($samples -notin @(20, 100)) { throw 'Expected a fixed independent sample count.' }
          $failed = $false
          Push-Location server
          try {
            foreach ($trial in 1..$samples) {
              $env:WEBMUX_BROWSER_NAVIGATION_ARTIFACT_DIR = Join-Path $env:RUNNER_TEMP "native-first-navigation/cleanup-sample-$trial"
              go test ./internal/browser -run '^TestNativeFirstNavigationComponents$/^direct-home-websocket$' -count=1 -timeout=3m -v
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
          } finally { Pop-Location }
          if ($failed) { throw 'One or more independent private-profile cleanup samples failed.' }
      - name: Preserve bounded diagnostic records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: first-navigation-windows
          path: ${{ runner.temp }}/native-first-navigation/**/*.json
      - name: Preserve native sandbox access receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chromium-sandbox-access-windows
          path: |
            ${{ runner.temp }}/chromium-sandbox-scope.json
            ${{ runner.temp }}/chromium-sandbox-access.json
