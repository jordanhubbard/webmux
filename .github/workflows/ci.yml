name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep the independent Argon2 compatibility fixture compatible with macOS runners.
env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  virtual-usb:
    name: Virtual USB kernel integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      USB_TEST_KERNEL: 6.8.0-146-generic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: webmux/server/go.mod
      - name: Test USB sysfs detach polling
        run: python3 -m unittest discover -s tests -p test_usb_sysfs.py
      - name: Test pinned USB source acquisition
        run: python3 -m unittest discover -s scripts -p test_vudc_sources.py
      - name: Test local USB fixture admission
        run: python3 -m unittest discover -s scripts -p test_usb_fixture_context.py
      - name: Test held-reply failure observations
        run: python3 -m unittest discover -s tests -p test_usb_hold_diagnostics.py
      - name: Test Ubuntu package mirror configuration
        run: python3 -m unittest discover -s tests -p test_ci_apt.py
      - name: Configure Ubuntu package mirrors and network bounds
        run: sudo -n env GITHUB_ACTIONS=true python3 scripts/configure-ci-apt.py
      - name: Install native kernel USB fixture prerequisites
        run: |
          sudo -n apt-get update
          # Hosted Azure kernels omit gadget drivers. Boot an isolated generic
          # kernel with matching modules instead of mutating the host kernel.
          # This console-only guest needs no recommended GUI/audio stack.
          # Keep QEMU tools explicit while leaving native budgets unchanged.
          sudo -n apt-get install -y --no-install-recommends openssh-server qemu-system-x86 qemu-utils busybox-static python3-venv "linux-image-$USB_TEST_KERNEL" "linux-modules-extra-$USB_TEST_KERNEL" "linux-tools-$USB_TEST_KERNEL"
          for module in usbip-vudc g_mass_storage vhci-hcd; do
            modinfo -k "$USB_TEST_KERNEL" -F filename "$module"
          done
          python3 -m venv "$RUNNER_TEMP/virtme"
          "$RUNNER_TEMP/virtme/bin/pip" install virtme-ng==1.41
      - name: Build CLI and separate worker
        working-directory: webmux/server
        run: go build -o "$RUNNER_TEMP/webmux" ./cmd/webmux
      - name: Reuse checksum-verified virtual USB source files
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/webmux-vudc-source-cache
          key: ${{ runner.os }}-webmux-vudc-sources-v1-${{ hashFiles('tests/usb-vudc-sources.json') }}
      - name: Qualify virtual gadget teardown and USB over SSH
        run: |
          sudo -n apt-get install -y build-essential "linux-headers-$USB_TEST_KERNEL"
          df -Pk "$RUNNER_TEMP" /tmp
          python3 scripts/test_qualify_vudc.py
          sudo -n env GITHUB_ACTIONS=true PATH="$RUNNER_TEMP/virtme/bin:/usr/sbin:/usr/bin:/sbin:/bin" python3 scripts/qualify-test-vudc.py --kernel "$USB_TEST_KERNEL" --vm-runner "$RUNNER_TEMP/virtme/bin/vng" --binary "$RUNNER_TEMP/webmux" --build-root "$RUNNER_TEMP/webmux-vudc" --source-cache "$RUNNER_TEMP/webmux-vudc-source-cache"
      - name: Preserve virtual gadget qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: virtual-usb-gadget-build
          path: |
            ${{ runner.temp }}/webmux-vudc/**/*.log
            ${{ runner.temp }}/webmux-vudc/**/*.json
            ${{ runner.temp }}/webmux-vudc/*.log
            ${{ runner.temp }}/webmux-vudc/*.json

  security:
    name: Dependency audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: webmux/server/go.mod
      - run: npm ci && npm run check:lock && npm audit --audit-level=low
        working-directory: webmux
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: webmux/server
  go-server:
    timeout-minutes: 30
    name: Go Server (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-arm64' && github.event_name != 'pull_request' && vars.WEBMUX_MACOS_RUNNER || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            runner: ubuntu-22.04
          - os: macos-arm64
            runner: macos-26
          - os: windows-2022
            runner: windows-2022
    env:
      # Retain sanitized Git phase logs if an original source test fails (#695).
      WEBMUX_SOURCE_TIMINGS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_AUTOREMOVE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    steps:
      - name: Verify temporary macOS runner and record provenance
        id: macos_runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          printf 'macOS ARM64 runner: %s\n' "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"
          sw_vers >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            cache_root="$RUNNER_TOOL_CACHE/webmux-build-cache"
            mkdir -p "$cache_root"
            {
              printf 'NPM_CONFIG_CACHE=%s/npm\n' "$cache_root"
              printf 'GOCACHE=%s/go-build\n' "$cache_root"
              printf 'GOPATH=%s/go\n' "$cache_root"
            } >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: webmux/server/go.mod
          cache: ${{ runner.environment != 'self-hosted' }}
          cache-dependency-path: webmux/server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: webmux/package-lock.json
      - name: Test native server with race detector
        working-directory: webmux/server
        run: go test -race ./...
      - name: Verify terminal engine provenance
        run: python3 scripts/verify-vt-provenance.py
      - name: Verify retained cell model provenance
        run: python3 scripts/verify-uv-provenance.py
      - name: Test retained cell model
        working-directory: webmux/server/internal/thirdparty/ultraviolet
        run: go test -race ./...
      - name: Vet retained cell model
        working-directory: webmux/server/internal/thirdparty/ultraviolet
        run: go vet ./...
      - name: Test retained terminal engine
        working-directory: webmux/server/internal/thirdparty/vt
        run: go test -race ./...
      - name: Vet retained terminal engine
        working-directory: webmux/server/internal/thirdparty/vt
        run: go vet ./...
      - name: Repeat Windows SSH CLI lifecycle
        if: runner.os == 'Windows'
        working-directory: webmux/server
        run: go test -race -v ./internal/usbforward -run TestRealSSHTransportAndHostKeyRejection -count=3
      - name: Repeat native Windows resize acceptance
        if: runner.os == 'Windows'
        working-directory: webmux/server
        run: go test -race ./internal/terminal -run 'TestTerminal(InputResizeAndExit|ResizeWaitCannotInventSize)' -count=20
      - name: Vet native server
        working-directory: webmux/server
        run: go vet ./...
      - name: Install test dependencies
        working-directory: webmux
        run: npm ci
      - name: Install browser for native screen interoperability
        if: runner.os == 'Windows'
        working-directory: webmux
        run: npx playwright install chromium
      - name: Collect real ConPTY streams outside the restrictive runner job
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/collect-native-screen.ps1 -OutputDirectory "$env:RUNNER_TEMP/webmux-native-screen"
          "WEBMUX_NATIVE_SCREEN_CAPTURES=$env:RUNNER_TEMP/webmux-native-screen/captures.json" >> $env:GITHUB_ENV
          "WEBMUX_NATIVE_SCREEN_TEST_LOG=$env:RUNNER_TEMP/webmux-native-screen/tests.jsonl" >> $env:GITHUB_ENV
      - name: Compare real ConPTY snapshots with the frontend renderer
        if: runner.os == 'Windows'
        working-directory: webmux
        env:
          WEBMUX_SCREEN_REPLAY_ONLY: '1'
        run: npm run test:e2e -- screen-replay.spec.ts
      - name: Preserve native screen interoperability receipts
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-screen-interoperability
          path: |
            webmux/test-results
            test-results
            ${{ runner.temp }}/webmux-native-screen
      - name: Verify Go API contracts
        working-directory: webmux
        run: npm run test:contract
      - name: Measure backend performance
        if: runner.os != 'Windows'
        working-directory: webmux
        run: node scripts/benchmark-server.mts
      - name: Preserve backend performance measurements
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-performance-${{ runner.os }}
          path: webmux/benchmark-results.json
      - name: Build browser application
        if: runner.os == 'Linux'
        working-directory: webmux
        run: npm run build --workspace=frontend
      - name: Configure Ubuntu package mirrors and network bounds
        if: runner.os == 'Linux'
        run: sudo -n env GITHUB_ACTIONS=true python3 scripts/configure-ci-apt.py
      - name: Install browser for Go tests
        if: runner.os == 'Linux'
        working-directory: webmux
        run: |
          npx playwright install --with-deps chromium
          sudo -n apt-get install -y tmux
      - name: Update Ubuntu C library security baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 22.04
          package="libc6:$(dpkg --print-architecture)"
          evidence="$RUNNER_TEMP/webmux-ci-libc"
          mkdir -p "$evidence"
          # Playwright's preceding --with-deps refreshes the signed APT indexes.
          dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' "$package" > "$evidence/before.txt"
          apt-cache policy "$package" > "$evidence/candidate.txt"
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --only-upgrade --no-remove --no-install-recommends "$package"
          dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' "$package" > "$evidence/after.txt"
          installed=$(dpkg-query -W -f='${Version}' "$package")
          echo 'USN-9065-1 requires Jammy libc6 >= 2.35-0ubuntu3.18'
          cat "$evidence/after.txt"
          dpkg --compare-versions "$installed" ge 2.35-0ubuntu3.18
      - name: Verify native iframe ownership and control dispatch
        if: runner.os == 'Linux'
        shell: bash
        working-directory: webmux
        env:
          WEBMUX_REAL_BROWSER: '1'
        run: |
          set -o pipefail
          export WEBMUX_BROWSER_EXECUTABLE="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          cd server
          go test -race ./internal/browser -run '^TestNativePageFrameControls$' -count=1 -timeout=2m -json | tee "$RUNNER_TEMP/browser-frame-controls.jsonl"
      - name: Install qualified tmux for Rig coordination
        if: runner.os == 'Linux'
        run: |
          sudo -n apt-get install -y libevent-dev libncurses-dev
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tmux-3.4.tar.gz" https://github.com/tmux/tmux/releases/download/3.4/tmux-3.4.tar.gz
          echo "551ab8dea0bf505c0ad6b7bb35ef567cdde0ccb84357df142c254f35a23e19aa  $RUNNER_TEMP/tmux-3.4.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tmux-3.4.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-3.4"
          ./configure --prefix="$RUNNER_TEMP/webmux-tmux"
          make -j2
          make install
          echo "$RUNNER_TEMP/webmux-tmux/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/webmux-tmux/bin/tmux" -V
      - name: Verify browser workflows against Go
        if: runner.os == 'Linux'
        working-directory: webmux
        run: npm run test:e2e:go
      - name: Check Go screenshot repeatability
        if: runner.os == 'Linux'
        working-directory: webmux
        run: npm run test:visual
      - name: Install real desktop test dependencies
        id: desktop-tools
        if: runner.os == 'Linux'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y openssh-server mosh tmux xvfb x11vnc x11-xserver-utils x11-utils xdotool xclip guacd libguac-client-rdp0 freerdp2-shadow-x11
      - name: Verify real agent workflows and screenshot repeatability
        if: runner.os == 'Linux'
        working-directory: webmux
        env:
          WEBMUX_REAL_AGENTS: '1'
          WEBMUX_VISUAL_PARITY: '1'
        run: |
          npm run test:e2e -- agent-integration.spec.ts --update-snapshots=all --output=test-results/agents-baseline
          npm run test:e2e:go -- agent-integration.spec.ts --update-snapshots=none --output=test-results/agents-go
      - name: Verify real SSH interoperability through Go
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.desktop-tools.outcome == 'success' }}
        working-directory: webmux
        env:
          WEBMUX_REAL_SSH: '1'
        run: |
          ssh_result=0
          npm run test:e2e:go -- ssh-integration.spec.ts --output=test-results/ssh-go || ssh_result=1
          exit "$ssh_result"
      - name: Verify automatic browser launch through real Mosh
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.desktop-tools.outcome == 'success' }}
        working-directory: webmux
        env:
          WEBMUX_REAL_MOSH: '1'
        run: npm run test:e2e:go -- mosh-browser.spec.ts --output=test-results/mosh-go
      - name: Verify managed agents through the published Rig CLI
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.desktop-tools.outcome == 'success' }}
        working-directory: webmux
        env:
          WEBMUX_REAL_OPENRIG: '1'
          OPENRIG_HOST_SELECTED: 'webmux-ci-unrelated-selection'
        run: |
          npm install --prefix "$RUNNER_TEMP/webmux-openrig" --no-audit --no-fund @openrig/cli@0.6.14
          export WEBMUX_OPENRIG_CLI="$RUNNER_TEMP/webmux-openrig/node_modules/@openrig/cli/dist/bin-wrapper.js"
          npm run test:e2e:go -- openrig.spec.ts --output=test-results/openrig-go
          node ../scripts/qualify-openrig-fixture-lifecycle.mts test-results/rig-worker-lifecycle
          npm run test:e2e:go -- openrig-host.spec.ts --output=test-results/openrig-host-go
          npm run test:e2e:go -- openrig-identity.spec.ts --output=test-results/openrig-identity-go
          npm run test:e2e:go -- openrig-activity.spec.ts --output=test-results/openrig-activity-go
          npm run test:e2e:go -- openrig-notifications.spec.ts --output=test-results/openrig-notifications-go
          WEBMUX_REAL_AGENTS=1 npm run test:e2e:go -- agent-integration.spec.ts --output=test-results/agents-rig-coexistence
      - name: Preserve native Rig browser diagnostics
        if: ${{ always() && runner.os == 'Linux' && steps.desktop-tools.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-rig-browser-diagnostics
          path: webmux/test-results/openrig-go/
          if-no-files-found: warn
      - name: Verify checked local Rig Stop with the published native contract
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.desktop-tools.outcome == 'success' }}
        working-directory: webmux
        env:
          WEBMUX_REAL_OPENRIG: '1'
          OPENRIG_HOST_SELECTED: 'webmux-ci-unrelated-selection'
        run: |
          python3 -m unittest discover -s ../scripts -p test_rig_stop_relay.py -v
          python3 -m unittest discover -s ../scripts -p test_qualify_rig_stop_relay.py -v
          df -Pk "$RUNNER_TEMP" "$PWD" "$(npm config get cache)"
          sudo -n apt-get install -y lsof
          npm install --prefix "$RUNNER_TEMP/webmux-openrig-stop" --ignore-scripts --no-audit --no-fund @openrig/cli@0.7.18
          export WEBMUX_OPENRIG_CLI="$RUNNER_TEMP/webmux-openrig-stop/node_modules/@openrig/cli/dist/bin-wrapper.js"
          mkdir -p test-results
          cp -f "$RUNNER_TEMP/webmux-openrig-stop/package-lock.json" test-results/openrig-stop-install-lock.json
          test "$(node "$WEBMUX_OPENRIG_CLI" --version)" = '0.7.18 (3bf87c62)'
          npm run test:e2e:go -- openrig-stop.spec.ts --output=test-results/openrig-checked-stop
          df -Pk "$(docker info --format '{{.DockerRootDir}}')" "$RUNNER_TEMP" "$PWD"
          python3 ../scripts/qualify-rig-stop-relay.py --cli "$WEBMUX_OPENRIG_CLI" --output "$PWD/test-results/openrig-stop-relay"
      - name: Verify real VNC interoperability through Go
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.desktop-tools.outcome == 'success' }}
        working-directory: webmux
        env:
          WEBMUX_REAL_VNC: '1'
        run: |
          desktop_result=0
          npm run test:e2e:go -- vnc-integration.spec.ts --output=test-results/vnc-go || desktop_result=1
          exit "$desktop_result"
      - name: Build verified RDP proxy
        id: rdp-proxy
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.desktop-tools.outcome == 'success' }}
        run: |
          sudo -n apt-get install -y build-essential pkg-config libcairo2-dev libjpeg-turbo8-dev libpng-dev uuid-dev libssl-dev freerdp2-dev libpango1.0-dev
          python3 scripts/build-guacd.py --prefix "$RUNNER_TEMP/webmux-guacd" --build-root "$RUNNER_TEMP/webmux-guacd-build"
      - name: Verify live native component inventory
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.rdp-proxy.outcome == 'success' }}
        env:
          WEBMUX_NATIVE_COMPONENTS_GUACD: ${{ runner.temp }}/webmux-guacd/sbin/guacd
          WEBMUX_NATIVE_COMPONENTS_OUTPUT: ${{ runner.temp }}/webmux-native-components
          LD_LIBRARY_PATH: ${{ runner.temp }}/webmux-guacd/lib
        run: python3 scripts/test_native_components_live.py
      - name: Verify RDP startup registration ordering
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.rdp-proxy.outcome == 'success' }}
        run: |
          python3 scripts/test_qualify_rdp_startup.py
          python3 scripts/qualify-rdp-startup.py --legacy /usr/sbin/guacd --qualified "$RUNNER_TEMP/webmux-guacd/sbin/guacd" --library-path "$RUNNER_TEMP/webmux-guacd/lib" --output webmux/test-results/rdp-startup
      - name: Verify real RDP interoperability through Go
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.rdp-proxy.outcome == 'success' }}
        working-directory: webmux
        env:
          WEBMUX_REAL_RDP: '1'
          WEBMUX_GUACD_EXECUTABLE: ${{ runner.temp }}/webmux-guacd/sbin/guacd
          LD_LIBRARY_PATH: ${{ runner.temp }}/webmux-guacd/lib
        run: npm run test:e2e:go -- rdp-integration.spec.ts --output=test-results/rdp-go
      - name: Preserve browser parity evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-parity-linux
          include-hidden-files: true
          path: |
            tests/e2e/.visual-baseline
            webmux/test-results
            ${{ runner.temp }}/webmux-guacd-build/*.log
            ${{ runner.temp }}/webmux-guacd-build/*.json
            ${{ runner.temp }}/webmux-guacd-build/*.txt
            ${{ runner.temp }}/webmux-native-components
            ${{ runner.temp }}/webmux-ci-libc
            ${{ runner.temp }}/browser-frame-controls.jsonl
            test-results

  test:
    name: Frontend and Tooling Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webmux/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webmux

      - name: Type check
        run: npm run typecheck
        working-directory: webmux

      - name: Test native component inventory controls
        run: python3 -m unittest discover -s scripts -p test_native_components.py

      - name: Verify native Codex qualification witness controls
        run: python3 -m unittest discover -s tests -p test_native_codex_launch_witness.py -v

      - name: Verify native TypeScript 7 source discovery
        timeout-minutes: 5
        run: |
          probe="$RUNNER_TEMP/webmux-typescript7-coverage"
          npm install --prefix "$probe" --ignore-scripts --no-package-lock --no-audit --no-fund typescript@7.0.2
          WEBMUX_TEST_TYPESCRIPT_CLI="$probe/node_modules/typescript/bin/tsc" node --test webmux/scripts/typescript-project.test.mts

      - name: Lint
        run: npm run lint --workspace=frontend
        working-directory: webmux

      - name: Run frontend tests
        run: npm run test --workspace=frontend
        working-directory: webmux

      - name: Install tmux for helper lifecycle tests
        run: sudo -n apt-get install -y tmux

      - name: Test compiled TypeScript helpers
        run: npm run test:helpers
        working-directory: webmux

  build:
    name: Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: webmux/server/go.mod
          cache-dependency-path: webmux/server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webmux/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webmux

      - name: Build
        run: npm run build
        working-directory: webmux

  windows:
    name: Windows Tests and Build
    runs-on: windows-2022
    env:
      WEBMUX_SOURCE_TIMINGS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: webmux/server/go.mod
          cache-dependency-path: webmux/server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webmux/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webmux

      - name: Type check
        run: npm run typecheck
        working-directory: webmux

      - name: Verify native TypeScript 7 source discovery
        timeout-minutes: 5
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'webmux-typescript7-coverage'
          npm install --prefix $probe --ignore-scripts --no-package-lock --no-audit --no-fund typescript@7.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Native TypeScript qualification install failed.' }
          $env:WEBMUX_TEST_TYPESCRIPT_CLI = Join-Path $probe 'node_modules/typescript/bin/tsc'
          node --test webmux/scripts/typescript-project.test.mts
          if ($LASTEXITCODE -ne 0) { throw 'Native TypeScript source discovery failed.' }

      - name: Lint
        run: npm run lint
        working-directory: webmux

      - name: Run unit tests
        run: npm test
        working-directory: webmux

      - name: Repeat retained Windows terminal failure context
        shell: pwsh
        working-directory: webmux/server/internal/thirdparty/vt
        run: |
          $context = @{ source = (git rev-parse HEAD); goVersion = (go version); cpu = @(); enabledXStateFeatures = 'unavailable' }
          try { $context.cpu = @(Get-CimInstance Win32_Processor -ErrorAction Stop | Select-Object Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors) } catch { $context.cpuState = 'unavailable' }
          try {
            Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public static class WebMuxVtCpu { [DllImport("kernel32.dll")] public static extern ulong GetEnabledXStateFeatures(); }' -ErrorAction Stop
            $context.enabledXStateFeatures = ('0x{0:x}' -f [WebMuxVtCpu]::GetEnabledXStateFeatures())
          } catch { $context.xstateState = 'unavailable' }
          $context | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/webmux-vt-runtime-context.json"
          go test -json . -count=10 -timeout=10m | Tee-Object -FilePath "$env:RUNNER_TEMP/webmux-vt-repeat.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows VT repetition failed' }

      - name: Preserve Windows terminal repetition receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-vt-repeat
          path: |
            ${{ runner.temp }}/webmux-vt-repeat.jsonl
            ${{ runner.temp }}/webmux-vt-runtime-context.json

      - name: Build
        run: npm run build
        working-directory: webmux

      - name: Install Playwright Chromium
        id: windows_browser_tools
        run: npx playwright install chromium
        working-directory: webmux

      - name: Prepare protected Windows Chromium access
        shell: pwsh
        working-directory: webmux
        run: |
          $browser = (node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the qualified Chromium executable.' }
          $cache = Join-Path $env:LOCALAPPDATA 'ms-playwright'
          if ($env:PLAYWRIGHT_BROWSERS_PATH) {
            if (-not [IO.Path]::IsPathRooted($env:PLAYWRIGHT_BROWSERS_PATH)) { throw 'Expected an absolute owned Playwright cache.' }
            $cache = $env:PLAYWRIGHT_BROWSERS_PATH
          }
          & ../scripts/test-windows-chromium-sandbox.ps1 -TestRoot (Join-Path $env:RUNNER_TEMP 'chromium-sandbox-scope-controls') -ReceiptPath (Join-Path $PWD 'test-results/chromium-sandbox-scope.json')
          & ../scripts/prepare-windows-chromium-sandbox.ps1 -BrowserPath $browser -InstallRoot $cache -ReceiptPath (Join-Path $PWD 'test-results/chromium-sandbox-access.json')
      - name: Run browser tests against Go
        run: npm run test:e2e:go
        working-directory: webmux
        env:
          WEBMUX_BROWSER_NAVIGATION_DIAGNOSTICS: '1'

      - name: Observe native application worker resources
        if: ${{ !cancelled() && steps.windows_browser_tools.outcome == 'success' }}
        shell: pwsh
        run: |
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Select-Object DeviceID, Size, FreeSpace
          foreach ($sample in 1..3) {
            Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory
            Get-CimInstance Win32_PerfFormattedData_PerfOS_Processor -Filter "Name='_Total'" | Select-Object PercentProcessorTime
            if ($sample -lt 3) { Start-Sleep -Seconds 5 }
          }
      - name: Qualify connected local application in disposable hosted fixture
        if: ${{ !cancelled() && steps.windows_browser_tools.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/qualify-windows-local-application.ps1 -OutputDirectory "$env:RUNNER_TEMP/webmux-native-local-application"

      - name: Stress Windows terminal reconnect
        run: npm run test:e2e:go -- terminal-mouse.spec.ts --grep restart --repeat-each=10 --output=test-results/reconnect-stress
        working-directory: webmux

      - name: Check Go screenshot repeatability
        run: npm run test:visual
        working-directory: webmux

      - name: Qualify first browser navigation components
        if: ${{ !cancelled() && steps.windows_browser_tools.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: webmux
        shell: pwsh
        env:
          WEBMUX_REAL_BROWSER: '1'
          WEBMUX_BROWSER_REQUIRE_NETWORK_APPCONTAINER: '1'
          WEBMUX_BROWSER_NAVIGATION_DIAGNOSTICS: '1'
        run: |
          $env:WEBMUX_BROWSER_EXECUTABLE = (node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the qualified Chromium executable.' }
          $env:WEBMUX_BROWSER_NAVIGATION_ARTIFACT_DIR = Join-Path $PWD 'test-results/native-first-navigation'
          Push-Location server
          try {
            go test ./internal/browser -run '^(TestNativeFirstNavigationComponents|TestNativeNavigationTraceCancellation)$' -count=1 -timeout=3m -v
            if ($LASTEXITCODE -ne 0) { throw 'Native first-navigation component qualification failed.' }
          } finally { Pop-Location }

      - name: Preserve browser parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-parity-windows
          include-hidden-files: true
          path: |
            tests/e2e/.visual-baseline
            webmux/test-results
            test-results
            ${{ runner.temp }}/webmux-native-local-application/public
