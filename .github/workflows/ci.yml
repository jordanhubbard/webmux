name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-server:
    name: Go Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: webmux/server/go.mod
          cache-dependency-path: webmux/server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webmux/package-lock.json
      - name: Test native server with race detector
        working-directory: webmux/server
        run: go test -race ./...
      - name: Vet native server
        working-directory: webmux/server
        run: go vet ./...
      - name: Install compatibility test dependencies
        working-directory: webmux
        run: npm ci
      - name: Verify Node and Go API compatibility
        working-directory: webmux
        run: npm run test:contract
      - name: Build browser application
        if: runner.os == 'Linux'
        working-directory: webmux
        run: npm run build --workspace=frontend
      - name: Install browser for Go parity tests
        if: runner.os == 'Linux'
        working-directory: webmux
        run: npx playwright install --with-deps chromium
      - name: Verify browser workflows against Go
        if: runner.os == 'Linux'
        working-directory: webmux
        run: npm run test:e2e:go
      - name: Compare Node and Go screenshots
        if: runner.os == 'Linux'
        working-directory: webmux
        run: npm run test:visual-parity
      - name: Preserve browser parity evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: browser-parity-linux
          include-hidden-files: true
          path: |
            tests/e2e/.visual-baseline
            webmux/test-results

  test:
    name: Backend Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webmux/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webmux

      - name: Type check
        run: npm run typecheck
        working-directory: webmux

      - name: Lint
        run: npm run lint
        working-directory: webmux

      - name: Run backend tests
        run: npm run test --workspace=backend
        working-directory: webmux

      - name: Test compiled TypeScript helpers
        run: npm run test:helpers
        working-directory: webmux

  build:
    name: Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webmux/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webmux

      - name: Build
        run: npm run build
        working-directory: webmux

  windows:
    name: Windows Tests and Build
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: webmux/server/go.mod
          cache-dependency-path: webmux/server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webmux/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webmux

      - name: Type check
        run: npm run typecheck
        working-directory: webmux

      - name: Lint
        run: npm run lint
        working-directory: webmux

      - name: Run unit tests
        run: npm test
        working-directory: webmux

      - name: Build
        run: npm run build
        working-directory: webmux

      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: webmux

      - name: Run browser tests
        run: npm run test:e2e
        working-directory: webmux

      - name: Run browser tests against Go
        run: npm run test:e2e:go
        working-directory: webmux

      - name: Compare Node and Go screenshots
        run: npm run test:visual-parity
        working-directory: webmux

      - name: Preserve browser parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-parity-windows
          include-hidden-files: true
          path: |
            tests/e2e/.visual-baseline
            webmux/test-results
