name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep the independent Argon2 compatibility fixture compatible with macOS runners.
env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  virtual-usb:
    name: Virtual USB kernel integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      USB_TEST_KERNEL: 6.8.0-146-generic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: webmux/server/go.mod
      - name: Test USB sysfs detach polling
        run: python3 -m unittest discover -s tests -p test_usb_sysfs.py
      - name: Test Ubuntu package mirror configuration
        run: python3 -m unittest discover -s tests -p test_ci_apt.py
      - name: Configure Ubuntu package mirrors and network bounds
        run: sudo -n python3 scripts/configure-ci-apt.py
      - name: Install native kernel USB fixture prerequisites
        run: |
          sudo -n apt-get update
          # Hosted Azure kernels omit gadget drivers. Boot an isolated generic
          # kernel with matching modules instead of mutating the host kernel.
          sudo -n apt-get install -y openssh-server qemu-system-x86 busybox-static python3-venv "linux-image-$USB_TEST_KERNEL" "linux-modules-extra-$USB_TEST_KERNEL" "linux-tools-$USB_TEST_KERNEL"
          for module in usbip-vudc g_mass_storage vhci-hcd; do
            modinfo -k "$USB_TEST_KERNEL" -F filename "$module"
          done
          python3 -m venv "$RUNNER_TEMP/virtme"
          "$RUNNER_TEMP/virtme/bin/pip" install virtme-ng==1.41
      - name: Build CLI and separate worker
        working-directory: webmux/server
        run: go build -o "$RUNNER_TEMP/webmux" ./cmd/webmux
      - name: Exercise virtual USB over SSH
        run: |
          printf -v fixture_command '%q ' env GITHUB_ACTIONS=true python3 "$GITHUB_WORKSPACE/tests/usb-kernel.py" "$RUNNER_TEMP/webmux"
          # virtme otherwise locks every synthetic guest account. This guest
          # has no network adapter, and its fixture sshd allows public keys only.
          sudo -n env PATH="$RUNNER_TEMP/virtme/bin:/usr/sbin:/usr/bin:/sbin:/bin" PYTHONUNBUFFERED=1 timeout --kill-after=15s 180s "$RUNNER_TEMP/virtme/bin/vng" --run "$USB_TEST_KERNEL" --user root --empty-passwords --memory 1G --cpus 2 --verbose --exec "$fixture_command"
  security:
    name: Dependency audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: webmux/server/go.mod
      - run: npm ci && npm run check:lock && npm audit --audit-level=low
        working-directory: webmux
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: webmux/server
  go-server:
    timeout-minutes: 30
    name: Go Server (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-arm64' && github.event_name != 'pull_request' && vars.WEBMUX_MACOS_RUNNER || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            runner: ubuntu-22.04
          - os: macos-arm64
            runner: macos-26
          - os: windows-2022
            runner: windows-2022
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_AUTOREMOVE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    steps:
      - name: Verify temporary macOS runner and record provenance
        id: macos_runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          printf 'macOS ARM64 runner: %s\n' "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"
          sw_vers >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            cache_root="$RUNNER_TOOL_CACHE/webmux-build-cache"
            mkdir -p "$cache_root"
            printf 'NPM_CONFIG_CACHE=%s/npm\n' "$cache_root" >> "$GITHUB_ENV"
            printf 'GOCACHE=%s/go-build\n' "$cache_root" >> "$GITHUB_ENV"
            printf 'GOPATH=%s/go\n' "$cache_root" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: webmux/server/go.mod
          cache: ${{ runner.environment != 'self-hosted' }}
          cache-dependency-path: webmux/server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: webmux/package-lock.json
      - name: Test native server with race detector
        working-directory: webmux/server
        run: go test -race ./...
      - name: Repeat Windows SSH CLI lifecycle
        if: runner.os == 'Windows'
        working-directory: webmux/server
        run: go test -race ./internal/usbforward -run TestRealSSHTransportAndHostKeyRejection -count=3
      - name: Vet native server
        working-directory: webmux/server
        run: go vet ./...
      - name: Install test dependencies
        working-directory: webmux
        run: npm ci
      - name: Verify Go API contracts
        working-directory: webmux
        run: npm run test:contract
      - name: Measure backend performance
        if: runner.os != 'Windows'
        working-directory: webmux
        run: node scripts/benchmark-server.mts
      - name: Preserve backend performance measurements
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-performance-${{ runner.os }}
          path: webmux/benchmark-results.json
      - name: Build browser application
        if: runner.os == 'Linux'
        working-directory: webmux
        run: npm run build --workspace=frontend
      - name: Configure Ubuntu package mirrors and network bounds
        if: runner.os == 'Linux'
        run: sudo -n python3 scripts/configure-ci-apt.py
      - name: Install browser for Go tests
        if: runner.os == 'Linux'
        working-directory: webmux
        run: |
          npx playwright install --with-deps chromium
          sudo -n apt-get install -y tmux
      - name: Install qualified tmux for Rig coordination
        if: runner.os == 'Linux'
        run: |
          sudo -n apt-get install -y libevent-dev libncurses-dev
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tmux-3.4.tar.gz" https://github.com/tmux/tmux/releases/download/3.4/tmux-3.4.tar.gz
          echo "551ab8dea0bf505c0ad6b7bb35ef567cdde0ccb84357df142c254f35a23e19aa  $RUNNER_TEMP/tmux-3.4.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tmux-3.4.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-3.4"
          ./configure --prefix="$RUNNER_TEMP/webmux-tmux"
          make -j2
          make install
          echo "$RUNNER_TEMP/webmux-tmux/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/webmux-tmux/bin/tmux" -V
      - name: Verify browser workflows against Go
        if: runner.os == 'Linux'
        working-directory: webmux
        run: npm run test:e2e:go
      - name: Check Go screenshot repeatability
        if: runner.os == 'Linux'
        working-directory: webmux
        run: npm run test:visual
      - name: Install real desktop test dependencies
        id: desktop-tools
        if: runner.os == 'Linux'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y openssh-server tmux xvfb x11vnc x11-xserver-utils x11-utils xdotool xclip guacd libguac-client-rdp0 freerdp2-shadow-x11
      - name: Verify real agent workflows and screenshot repeatability
        if: runner.os == 'Linux'
        working-directory: webmux
        env:
          WEBMUX_REAL_AGENTS: '1'
          WEBMUX_VISUAL_PARITY: '1'
        run: |
          npm run test:e2e -- agent-integration.spec.ts --update-snapshots=all --output=test-results/agents-baseline
          npm run test:e2e:go -- agent-integration.spec.ts --update-snapshots=none --output=test-results/agents-go
      - name: Verify real SSH interoperability through Go
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.desktop-tools.outcome == 'success' }}
        working-directory: webmux
        env:
          WEBMUX_REAL_SSH: '1'
        run: |
          ssh_result=0
          npm run test:e2e:go -- ssh-integration.spec.ts --output=test-results/ssh-go || ssh_result=1
          exit "$ssh_result"
      - name: Verify managed agents through the published Rig CLI
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.desktop-tools.outcome == 'success' }}
        working-directory: webmux
        env:
          WEBMUX_REAL_OPENRIG: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/webmux-openrig" --no-audit --no-fund @openrig/cli@0.6.14
          export WEBMUX_OPENRIG_CLI="$RUNNER_TEMP/webmux-openrig/node_modules/@openrig/cli/dist/bin-wrapper.js"
          npm run test:e2e:go -- openrig.spec.ts --output=test-results/openrig-go
      - name: Verify real VNC interoperability through Go
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.desktop-tools.outcome == 'success' }}
        working-directory: webmux
        env:
          WEBMUX_REAL_VNC: '1'
        run: |
          desktop_result=0
          npm run test:e2e:go -- vnc-integration.spec.ts --output=test-results/vnc-go || desktop_result=1
          exit "$desktop_result"
      - name: Verify real RDP interoperability through Go
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.desktop-tools.outcome == 'success' }}
        working-directory: webmux
        env:
          WEBMUX_REAL_RDP: '1'
        run: |
          desktop_result=0
          npm run test:e2e:go -- rdp-integration.spec.ts --output=test-results/rdp-go || desktop_result=1
          exit "$desktop_result"
      - name: Preserve browser parity evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-parity-linux
          include-hidden-files: true
          path: |
            tests/e2e/.visual-baseline
            webmux/test-results

  test:
    name: Frontend and Tooling Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webmux/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webmux

      - name: Type check
        run: npm run typecheck
        working-directory: webmux

      - name: Lint
        run: npm run lint --workspace=frontend
        working-directory: webmux

      - name: Run frontend tests
        run: npm run test --workspace=frontend
        working-directory: webmux

      - name: Install tmux for helper lifecycle tests
        run: sudo -n apt-get install -y tmux

      - name: Test compiled TypeScript helpers
        run: npm run test:helpers
        working-directory: webmux

  build:
    name: Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: webmux/server/go.mod
          cache-dependency-path: webmux/server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webmux/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webmux

      - name: Build
        run: npm run build
        working-directory: webmux

  windows:
    name: Windows Tests and Build
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: webmux/server/go.mod
          cache-dependency-path: webmux/server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webmux/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webmux

      - name: Type check
        run: npm run typecheck
        working-directory: webmux

      - name: Lint
        run: npm run lint
        working-directory: webmux

      - name: Run unit tests
        run: npm test
        working-directory: webmux

      - name: Build
        run: npm run build
        working-directory: webmux

      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: webmux

      - name: Run browser tests against Go
        run: npm run test:e2e:go
        working-directory: webmux

      - name: Stress Windows terminal reconnect
        run: npm run test:e2e:go -- terminal-mouse.spec.ts --grep restart --repeat-each=10 --output=test-results/reconnect-stress
        working-directory: webmux

      - name: Check Go screenshot repeatability
        run: npm run test:visual
        working-directory: webmux

      - name: Preserve browser parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-parity-windows
          include-hidden-files: true
          path: |
            tests/e2e/.visual-baseline
            webmux/test-results
