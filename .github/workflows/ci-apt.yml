name: Ubuntu APT source controls

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/configure-ci-apt.py'
      - 'scripts/qualify-ci-apt.py'
      - 'tests/test_ci_apt.py'
      - '.github/workflows/ci-apt.yml'

permissions:
  contents: read

jobs:
  apt-sources:
    name: Native APT controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check worker resources
        run: |
          df -Pk "$RUNNER_TEMP" /tmp
          free -m
      - name: Test source selection and preserved configuration
        run: python3 -m unittest discover -s tests -p test_ci_apt.py -v
      - name: Qualify actual signed APT updates and failure controls
        run: sudo -n python3 scripts/qualify-ci-apt.py --output "$RUNNER_TEMP/apt-source-controls"
      - name: Retain native APT outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apt-source-controls-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/apt-source-controls/report.json
            ${{ runner.temp }}/apt-source-controls/*update.log
