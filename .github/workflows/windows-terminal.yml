name: Windows terminal qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    name: Native Windows terminal and clipboard
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: webmux/server/go.mod
          cache-dependency-path: webmux/server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webmux/package-lock.json
      - name: Observe native worker resources
        shell: pwsh
        run: |
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Select-Object DeviceID, Size, FreeSpace
          foreach ($sample in 1..3) {
            Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory
            Get-CimInstance Win32_PerfFormattedData_PerfOS_Processor -Filter "Name='_Total'" | Select-Object PercentProcessorTime
            if ($sample -lt 3) { Start-Sleep -Seconds 5 }
          }
      - run: npm ci
        working-directory: webmux
      - run: npm run build
        working-directory: webmux
      - run: npx playwright install chromium
        working-directory: webmux
      - run: go test -timeout 3m -v ./internal/terminal ./internal/nativeprovider
        working-directory: webmux/server
      - run: npm run test:e2e -- terminal-replay.spec.ts terminal-clipboard.spec.ts terminal-mouse.spec.ts --trace retain-on-failure
        working-directory: webmux
      - name: Require connected application in disposable hosted fixture
        shell: pwsh
        run: ./scripts/qualify-windows-local-application.ps1 -OutputDirectory "$env:RUNNER_TEMP/webmux-native-local-application"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-terminal-diagnostics
          path: |
            webmux/test-results
            ${{ runner.temp }}/webmux-native-local-application/public
